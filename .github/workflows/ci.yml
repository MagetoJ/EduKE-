name: EduKE CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

  backend:
    name: Backend CI & DevSecOps
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Dependency Security Audit
        run: |
          pip-audit -r requirements.txt

      - name: Static Security Scan
        run: |
          bandit -r . -x .venv,venv,legacy_js -f screen

      - name: Generate test JWT secret
        id: test_secret
        run: |
          echo "jwt_secret=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_OUTPUT"

      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: ${{ steps.test_secret.outputs.jwt_secret }}
        run: |
          python -m pytest -q

      - name: Compile Python source
        run: |
          python -m compileall -q .

  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for accidentally committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|development|production|test)$'; then
            echo "ERROR: Real environment file detected in Git."
            exit 1
          fi

          echo "Environment file check passed."